<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL 2026 | Playoff Predictor</title>
    <style>
        :root {
            --primary-bg: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
        h1 { color: var(--accent-blue); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; text-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }

        .toggle-container { display: flex; align-items: center; gap: 15px; background: var(--card-bg); padding: 10px 20px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); }
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-blue); }
        input:checked + .slider:before { transform: translateX(26px); }

        .toggle-label { font-size: 0.9rem; font-weight: bold; color: var(--text-dim); transition: 0.3s; }
        .active-label { color: var(--accent-blue); }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 1200px; width: 100%; }
        @media (max-width: 900px) { .dashboard { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); }
        h3 { margin-top: 0; border-bottom: 2px solid var(--accent-blue); padding-bottom: 10px; display: flex; justify-content: space-between; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: var(--text-dim); font-size: 0.85rem; text-transform: uppercase; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .pos-cell { font-weight: bold; width: 30px; }
        .team-cell { font-weight: 600; color: var(--accent-blue); }
        .pts-cell { font-weight: bold; color: var(--accent-green); }
        .top-four { background: rgba(74, 222, 128, 0.05); }
        
        select { background: #0f172a; color: white; border: 1px solid var(--accent-blue); padding: 6px 10px; border-radius: 6px; outline: none; cursor: pointer; width: 100%; }
        select:disabled { opacity: 0.5; cursor: not-allowed; border-color: var(--text-dim); }

        /* Prediction Ball Styling */
        .prediction-balls { display: flex; gap: 4px; align-items: center; }
        .ball { font-size: 1.1rem; filter: drop-shadow(0 0 2px rgba(0,0,0,0.5)); line-height: 1; }
        .win-ball { color: var(--accent-green); }
        .loss-ball { color: var(--accent-red); }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>IPL 2026 Predictor</h1>
        <div class="toggle-container">
            <span id="label-current" class="toggle-label active-label">Current Status</span>
            <label class="switch">
                <input type="checkbox" id="modeToggle" onchange="handleModeChange()">
                <span class="slider"></span>
            </label>
            <span id="label-predictor" class="toggle-label">Predictor Mode</span>
        </div>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3>Remaining Fixtures <span style="font-size:0.7rem; padding:2px 8px; border-radius:10px; background:var(--accent-blue); color:#000; font-weight:bold;">LIVE</span></h3>
            <table>
                <thead><tr><th>Date</th><th>Match</th><th>Winner</th></tr></thead>
                <tbody id="fixturesBody"></tbody>
            </table>
        </div>

        <div class="card">
            <h3 id="standingTitle">Current Standings</h3>
            <table>
                <thead>
                    <tr id="tableHead">
                        <th>#</th><th>Team</th><th>P</th><th>W</th><th>Pts</th>
                    </tr>
                </thead>
                <tbody id="pointsBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Real standings data as of May 17, 2026
        const initialTeams = [
            { name: "RCB", p: 12, w: 8, pts: 16 },
            { name: "GT", p: 13, w: 8, pts: 16 },
            { name: "SRH", p: 12, w: 7, pts: 14 },
            { name: "PBKS", p: 12, w: 6, pts: 13 },
            { name: "RR", p: 11, w: 6, pts: 12 },
            { name: "CSK", p: 12, w: 6, pts: 12 },
            { name: "KKR", p: 12, w: 5, pts: 11 },
            { name: "DC", p: 12, w: 5, pts: 10 },
            { name: "MI", p: 12, w: 4, pts: 8 },
            { name: "LSG", p: 12, w: 4, pts: 8 }
        ];

        // Upcoming remaining league fixtures from May 17 onwards
        const fixtures = [
            { date: "May 17", t1: "DC", t2: "RR" },
            { date: "May 18", t1: "CSK", t2: "SRH" },
            { date: "May 19", t1: "RR", t2: "LSG" },
            { date: "May 20", t1: "KKR", t2: "MI" },
            { date: "May 21", t1: "CSK", t2: "GT" },
            { date: "May 22", t1: "SRH", t2: "RCB" },
            { date: "May 23", t1: "LSG", t2: "PBKS" },
            { date: "May 24", t1: "MI", t2: "RR" },
            { date: "May 24", t1: "KKR", t2: "DC" }
        ];

        function getProbableWinner(teamA, teamB) {
            const t1 = initialTeams.find(t => t.name === teamA);
            const t2 = initialTeams.find(t => t.name === teamB);
            if (t1.pts !== t2.pts) return t1.pts > t2.pts ? teamA : teamB;
            return t1.w >= t2.w ? teamA : teamB;
        }

        function init() {
            const fBody = document.getElementById('fixturesBody');
            fixtures.forEach((m, index) => {
                const prob = getProbableWinner(m.t1, m.t2);
                fBody.innerHTML += `<tr>
                    <td style="font-size:0.8rem; color:var(--text-dim);">${m.date}</td>
                    <td>${m.t1} vs ${m.t2}</td>
                    <td>
                        <select class="win-select" data-index="${index}" data-saved="${prob}" onchange="updateTable()" disabled>
                            <option value="">Pending</option>
                            <option value="${m.t1}">${m.t1}</option>
                            <option value="${m.t2}">${m.t2}</option>
                        </select>
                    </td>
                </tr>`;
            });
            updateTable();
        }

        function handleModeChange() {
            const isPredictor = document.getElementById('modeToggle').checked;
            const dropdowns = document.querySelectorAll('.win-select');
            
            document.getElementById('label-current').classList.toggle('active-label', !isPredictor);
            document.getElementById('label-predictor').classList.toggle('active-label', isPredictor);
            document.getElementById('standingTitle').innerText = isPredictor ? "Projected Standings" : "Current Standings";
            
            document.getElementById('tableHead').innerHTML = isPredictor 
                ? '<th>#</th><th>Team</th><th>P</th><th>W</th><th>Pts</th><th>Predicted</th>' 
                : '<th>#</th><th>Team</th><th>P</th><th>W</th><th>Pts</th>';

            dropdowns.forEach(select => {
                select.disabled = !isPredictor;
                if (isPredictor) select.value = select.getAttribute('data-saved');
                else { select.setAttribute('data-saved', select.value); select.value = ""; }
            });
            updateTable();
        }

        function updateTable() {
            const isPredictor = document.getElementById('modeToggle').checked;
            let currentStats = initialTeams.map(t => ({ ...t, upcoming: [] }));
            const dropdowns = document.querySelectorAll('.win-select');

            dropdowns.forEach(select => {
                const winner = select.value;
                const match = fixtures[select.getAttribute('data-index')];
                if (winner) {
                    let wTeam = currentStats.find(t => t.name === winner);
                    wTeam.w++; wTeam.p++; wTeam.pts += 2;
                    wTeam.upcoming.push({ result: 'W', opp: winner === match.t1 ? match.t2 : match.t1 });
                    
                    let lTeam = currentStats.find(t => t.name === (winner === match.t1 ? match.t2 : match.t1));
                    lTeam.p++;
                    lTeam.upcoming.push({ result: 'L', opp: winner });
                }
            });

            currentStats.sort((a, b) => b.pts - a.pts || b.w - a.w);
            const pBody = document.getElementById('pointsBody');
            pBody.innerHTML = '';
            currentStats.forEach((t, i) => {
                let row = `<tr class="${i < 4 ? 'top-four' : ''}">
                    <td class="pos-cell">${i + 1}</td>
                    <td class="team-cell">${t.name}</td>
                    <td>${t.p}</td><td>${t.w}</td><td class="pts-cell">${t.pts}</td>`;
                
                if (isPredictor) {
                    let balls = '<td class="prediction-balls">';
                    if (t.upcoming.length === 0) {
                        balls += '<span style="color:var(--text-dim); font-size:0.8rem;">No matches remaining</span>';
                    } else {
                        t.upcoming.forEach(matchInfo => {
                            balls += `<span class="ball ${matchInfo.result === 'W' ? 'win-ball' : 'loss-ball'}" title="${matchInfo.result === 'W' ? 'Win' : 'Loss'} vs ${matchInfo.opp}">●</span>`;
                        });
                    }
                    row += balls + '</td>';
                }
                pBody.innerHTML += row + '</tr>';
            });
        }
        window.onload = init;
    </script>
</body>
</html>
