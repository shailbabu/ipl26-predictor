<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL 2026 | Playoff Predictor</title>
    <style>
        :root {
            --primary-bg: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }

        h3 {
            margin-top: 0;
            border-bottom: 2px solid var(--accent-blue);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            color: var(--text-dim);
            font-size: 0.85rem;
            text-transform: uppercase;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .pos-cell { font-weight: bold; width: 30px; }
        .team-cell { font-weight: 600; color: var(--accent-blue); }
        .pts-cell { font-weight: bold; color: var(--accent-green); }

        .top-four { background: rgba(74, 222, 128, 0.05); }

        .match-row:hover { background: rgba(255,255,255,0.02); }
        .date-text { font-size: 0.8rem; color: var(--text-dim); }

        select {
            background: #0f172a;
            color: white;
            border: 1px solid var(--accent-blue);
            padding: 6px 10px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            width: 100%;
        }

        select:hover { background: #1e293b; }

        .badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--accent-blue);
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>IPL 2026 Predictor</h1>

    <div class="dashboard">
        <div class="card">
            <h3>Remaining Fixtures <span class="badge">LIVE</span></h3>
            <table id="fixturesTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Match</th>
                        <th>Winner</th>
                    </tr>
                </thead>
                <tbody id="fixturesBody"></tbody>
            </table>
        </div>

        <div class="card">
            <h3>Projected Standings</h3>
            <table id="pointsTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Team</th>
                        <th>P</th>
                        <th>W</th>
                        <th>Pts</th>
                    </tr>
                </thead>
                <tbody id="pointsBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const initialTeams = [
            { name: "RCB", p: 11, w: 7, pts: 14 },
            { name: "SRH", p: 11, w: 7, pts: 14 },
            { name: "GT", p: 11, w: 7, pts: 14 },
            { name: "PBKS", p: 10, w: 6, pts: 12 },
            { name: "CSK", p: 11, w: 6, pts: 12 },
            { name: "RR", p: 11, w: 6, pts: 12 },
            { name: "KKR", p: 10, w: 4, pts: 8 },
            { name: "DC", p: 11, w: 4, pts: 8 },
            { name: "MI", p: 11, w: 3, pts: 6 },
            { name: "LSG", p: 11, w: 3, pts: 6 }
        ];

        const fixtures = [
            { date: "May 11", t1: "PBKS", t2: "DC" },
            { date: "May 12", t1: "GT", t2: "SRH" },
            { date: "May 13", t1: "RCB", t2: "KKR" },
            { date: "May 14", t1: "PBKS", t2: "MI" },
            { date: "May 15", t1: "LSG", t2: "CSK" },
            { date: "May 16", t1: "KKR", t2: "GT" },
            { date: "May 17", t1: "PBKS", t2: "RCB" },
            { date: "May 17", t1: "DC", t2: "RR" },
            { date: "May 18", t1: "CSK", t2: "SRH" },
            { date: "May 19", t1: "RR", t2: "LSG" },
            { date: "May 20", t1: "KKR", t2: "MI" },
            { date: "May 21", t1: "CSK", t2: "GT" },
            { date: "May 22", t1: "SRH", t2: "RCB" },
            { date: "May 23", t1: "LSG", t2: "PBKS" },
            { date: "May 24", t1: "MI", t2: "RR" },
            { date: "May 24", t1: "KKR", t2: "DC" }
        ];

        // Function to determine which team is more likely to win based on current standings
        function getProbableWinner(teamA, teamB) {
            const t1 = initialTeams.find(t => t.name === teamA);
            const t2 = initialTeams.find(t => t.name === teamB);
            
            // Priority 1: Higher Points
            if (t1.pts !== t2.pts) {
                return t1.pts > t2.pts ? teamA : teamB;
            }
            // Priority 2: Higher Win Count if points are equal
            return t1.w >= t2.w ? teamA : teamB;
        }

        function init() {
            const fBody = document.getElementById('fixturesBody');
            fixtures.forEach((m, index) => {
                const probableWinner = getProbableWinner(m.t1, m.t2);
                
                const row = `<tr class="match-row">
                    <td class="date-text">${m.date}</td>
                    <td>${m.t1} <small>vs</small> ${m.t2}</td>
                    <td>
                        <select class="win-select" data-index="${index}" onchange="updateTable()">
                            <option value="">Pending</option>
                            <option value="${m.t1}" ${probableWinner === m.t1 ? 'selected' : ''}>${m.t1}</option>
                            <option value="${m.t2}" ${probableWinner === m.t2 ? 'selected' : ''}>${m.t2}</option>
                        </select>
                    </td>
                </tr>`;
                fBody.innerHTML += row;
            });
            updateTable(); // Run update immediately to show projected standings on load
        }

        function updateTable() {
            let currentStats = initialTeams.map(t => ({ ...t }));
            const dropdowns = document.querySelectorAll('.win-select');

            dropdowns.forEach(select => {
                const winner = select.value;
                if (winner) {
                    const matchIndex = select.getAttribute('data-index');
                    const match = fixtures[matchIndex];
                    
                    let wTeam = currentStats.find(t => t.name === winner);
                    wTeam.w += 1; wTeam.p += 1; wTeam.pts += 2;

                    const loser = (winner === match.t1) ? match.t2 : match.t1;
                    let lTeam = currentStats.find(t => t.name === loser);
                    lTeam.p += 1;
                }
            });

            // Sort by Points, then by Wins
            currentStats.sort((a, b) => b.pts - a.pts || b.w - a.w);

            const pBody = document.getElementById('pointsBody');
            pBody.innerHTML = '';
            currentStats.forEach((t, i) => {
                const rowClass = i < 4 ? 'top-four' : '';
                pBody.innerHTML += `<tr class="${rowClass}">
                    <td class="pos-cell">${i + 1}</td>
                    <td class="team-cell">${t.name}</td>
                    <td>${t.p}</td>
                    <td>${t.w}</td>
                    <td class="pts-cell">${t.pts}</td>
                </tr>`;
            });
        }

        window.onload = init;
    </script>
</body>
</html>
